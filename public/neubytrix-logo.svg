<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients for swirling petals/ribbons -->
    <!-- Cyan / Sky Blue Ribbon (Top Left) -->
    <linearGradient id="nb-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4FF" />
      <stop offset="60%" stop-color="#0088EA" />
      <stop offset="100%" stop-color="#0057C2" />
    </linearGradient>

    <!-- Emerald / Green Ribbon (Top Right) -->
    <linearGradient id="nb-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70E000" />
      <stop offset="50%" stop-color="#38B000" />
      <stop offset="100%" stop-color="#007200" />
    </linearGradient>

    <!-- Lime Green Ribbon (Bottom Left) -->
    <linearGradient id="nb-lime-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCEE21" />
      <stop offset="40%" stop-color="#AACC00" />
      <stop offset="100%" stop-color="#2B9348" />
    </linearGradient>

    <!-- Golden Orange Wave (Middle Right Wing) -->
    <linearGradient id="nb-orange-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFDE59" />
      <stop offset="50%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FF6D00" />
    </linearGradient>

    <!-- Pink / Magenta Wave (Bottom Right) -->
    <linearGradient id="nb-pink-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5D8F" />
      <stop offset="40%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#B5179E" />
    </linearGradient>

    <!-- Bottom Deep Blue Crest -->
    <linearGradient id="nb-blue-crest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0096C7" />
      <stop offset="100%" stop-color="#03045E" />
    </linearGradient>

    <!-- Center Sun Orb (Yellow/Gold) -->
    <radialGradient id="nb-sun-grad" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF36D" />
      <stop offset="60%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </radialGradient>

    <!-- Soft Depth Shadows -->
    <filter id="nb-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="5" flood-color="#051026" flood-opacity="0.25" />
    </filter>

    <filter id="nb-inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Group with subtle drop shadow -->
  <g id="neubytrix-emblem">
    <!-- 1. Background Cyan-Blue Swirl Arc (Top & Upper Left) -->
    <path
      d="M250,55 C330,55 405,105 425,185 C390,165 340,150 280,160 C210,172 165,225 150,290 C125,275 110,240 110,205 C110,122 173,55 250,55 Z"
      fill="url(#nb-cyan-grad)"
      filter="url(#nb-soft-shadow)"
    />

    <!-- 2. Bottom Deep Blue Swirl Anchor -->
    <path
      d="M170,350 C210,430 310,460 380,410 C395,395 410,360 415,330 C370,390 285,410 215,380 C195,372 180,362 170,350 Z"
      fill="url(#nb-blue-crest)"
      filter="url(#nb-soft-shadow)"
    />

    <!-- 3. Top-Right Emerald Green Ribbon with Sweeping Wing -->
    <path
      d="M260,85 C325,85 390,115 425,170 C445,160 470,165 485,185 C460,185 435,200 415,220 C365,165 295,145 220,158 C240,110 250,85 260,85 Z"
      fill="url(#nb-green-grad)"
      filter="url(#nb-soft-shadow)"
    />

    <!-- 4. Lime Green Ribbon (Sweeping from bottom-left up to the side) -->
    <path
      d="M115,320 C85,250 90,175 135,120 C120,160 115,210 135,260 C155,310 195,350 240,380 C180,395 135,365 115,320 Z"
      fill="url(#nb-lime-grad)"
      filter="url(#nb-soft-shadow)"
    />

    <!-- 5. Bottom Hot Pink / Magenta Ribbon -->
    <path
      d="M165,390 C220,405 290,395 345,355 C390,320 415,270 420,225 C410,285 375,345 320,385 C275,415 210,425 155,405 C140,400 120,405 105,415 C125,400 145,393 165,390 Z"
      fill="url(#nb-pink-grad)"
      filter="url(#nb-soft-shadow)"
    />

    <!-- 6. Golden Orange Wing / Ribbon (Middle Right) -->
    <path
      d="M245,290 C310,270 375,245 420,205 C445,195 470,200 495,220 C465,228 435,250 410,275 C365,325 305,355 240,360 C265,335 270,305 245,290 Z"
      fill="url(#nb-orange-grad)"
      filter="url(#nb-soft-shadow)"
    />

    <!-- 7. Central Golden Sun Circle -->
    <circle
      cx="245"
      cy="245"
      r="88"
      fill="url(#nb-sun-grad)"
      filter="url(#nb-soft-shadow)"
    />

    <!-- 8. White Atom Symbol in the Center of Golden Sun -->
    <g id="nb-atom" filter="url(#nb-inner-glow)">
      <!-- Nucleus (Solid White Center Circle) -->
      <circle cx="245" cy="245" r="18" fill="#FFFFFF" />

      <!-- Orbit 1: Tilted -30deg -->
      <ellipse
        cx="245"
        cy="245"
        rx="58"
        ry="23"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"
        transform="rotate(-28 245 245)"
      />

      <!-- Orbit 2: Tilted +35deg -->
      <ellipse
        cx="245"
        cy="245"
        rx="58"
        ry="23"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"
        transform="rotate(38 245 245)"
      />

      <!-- Orbit 3: Steep Tilt +88deg (nearly vertical) -->
      <ellipse
        cx="245"
        cy="245"
        rx="58"
        ry="23"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="7"
        stroke-linecap="round"
        transform="rotate(95 245 245)"
      />

      <!-- Electron Beads along the orbits -->
      <circle cx="196" cy="268" r="7" fill="#FFFFFF" />
      <circle cx="278" cy="286" r="7" fill="#FFFFFF" />
      <circle cx="258" cy="192" r="6" fill="#FFFFFF" />
    </g>
  </g>
</svg>
